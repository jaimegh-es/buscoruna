name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: |
          touch dist/client/index.html
          npx cap sync android

      - name: Set versionCode to GitHub run number (enables auto-update comparison)
        run: |
          FILE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$FILE"
          grep versionCode "$FILE"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coruna-bus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (for in-app auto-update)
        # Release tagged with the app version; the app checks this endpoint to
        # detect and download newer APKs (auto-update).
        # Release etiquetado con la versión; la app consulta este endpoint para
        # detectar y descargar APKs nuevos (auto-actualización).
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Coruña Bus v${{ steps.version.outputs.version }} (${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          body: |
            Instala o actualiza descargando `app-debug.apk`.

            Auto-actualización: la app comprueba `https://api.github.com/repos/${{ github.repository }}/releases/latest` y propone instalar la versión nueva.
